# Runs on every push and pull request. A red check means the change must not be merged.
# The ruleset in ops/github/ruleset-main.json makes this job (named «tests») required for main.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the whole history, for the secrets check

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: La web solo promete lo que la app hace, y todo lo que enlaza existe
        run: node --test tests/web-boundaries.test.mjs tests/web-claims.test.mjs tests/web-rediseno.test.mjs tests/web-guias.test.mjs

      - name: Herramientas de Python
        run: pip install --quiet pytest==9.1.1 pyflakes==4.0.3 ruff==0.17.0

      - name: Revisión estática
        run: |
          python -m pyflakes ops tests
          ruff check ops tests

      - name: Pruebas de la comprobación del sitio y de los textos legales
        run: python -m pytest -q -p no:cacheprovider tests

      # The whole history, not only this change: a secret removed later is still in Git.
      - name: Secretos en el historial
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
