# Throwaway: checks the published site once in a real Chrome. Lives only on this temporary branch.
name: tmp verificar web
on:
  push:
    branches: ["tmp/verificar-web-vivo"]
permissions:
  contents: read
jobs:
  vivo:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - run: pip install --quiet playwright==1.63.0
      - run: python tmp_verificar/vivo.py
