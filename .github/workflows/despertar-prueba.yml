# Keeps the free 24-hour trial awake during the day, so the first visitor does not wait for it to start.
# Render's free plan puts a service to sleep after 15 minutes without visits and takes up to a minute to wake it.
# Every 5 minutes, from about 8:00 to 23:00 in Spain, this asks for one small static image of the trial. It must
# never ask for anything that reaches the database (/api/health does: Neon's free compute hours would run out), and
# it uses about 500 of Render's 750 free instance hours a month (tests/test_despertar_prueba.py keeps both true).
# Switch it off for good once the trial runs on a paid Render plan: Settings → Secrets and variables → Actions →
# Variables → PRUEBA_DE_PAGO = si. It never fails the run: the daily external check of the trial is what raises alarms.
name: Despertar la prueba

on:
  schedule:
    - cron: "3-58/5 6-21 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  despertar:
    if: vars.PRUEBA_DE_PAGO != 'si'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Pedir una imagen de la prueba
        run: |
          if curl --fail --silent --show-error --output /dev/null --max-time 120 --retry 1 --retry-delay 10 \
               --write-out 'HTTP %{http_code} en %{time_total} s\n' \
               https://nirkana-prueba.onrender.com/icons/simbolo.svg; then
            echo "La prueba responde."
          else
            echo "::warning::La prueba no respondió a tiempo."
          fi
